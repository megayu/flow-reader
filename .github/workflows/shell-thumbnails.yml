name: Shell integrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/shell-thumbnails.yml"
      - "crates/Cargo.lock"
      - "crates/Cargo.toml"
      - "crates/epub-cover/**"
      - "crates/epub-thumbnail/**"
      - "native/shell-thumbnails/**"
      - "scripts/build-installed-bundle.ts"
      - "scripts/build-thumbnail-distribution.ts"
      - "scripts/distribution-cargo.ts"
      - "scripts/release-local.ts"
      - "scripts/tsconfig.json"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.shell-windows.conf.json"
      - "src-tauri/tauri.shell-macos.conf.json"
      - "src-tauri/tauri.shell-linux.conf.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/src/lib.rs"
      - "src-tauri/src/storage/epub_import.rs"
      - "src-tauri/src/storage/epub_import/**"
      - "src/file.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: shell-thumbnails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.8.0
  CARGO_TERM_COLOR: always

jobs:
  core-check:
    name: Shared crates and web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/target
          key: shell-thumbnails-core-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: shell-thumbnails-core-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path crates/Cargo.toml --workspace

  windows:
    name: Windows COM and NSIS
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      WINDOWS_PROVIDER_PATH: native\shell-thumbnails\dist\windows\FlowReaderThumbnail.dll
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/target
            native/shell-thumbnails/target
            src-tauri/target
          key: shell-thumbnails-windows-${{ hashFiles('crates/Cargo.lock', 'native/shell-thumbnails/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: shell-thumbnails-windows-
      - run: pnpm install --frozen-lockfile
      - run: rustup target add x86_64-pc-windows-msvc

      - name: Verify ordinary Tauri build isolation
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath native\shell-thumbnails\dist) {
            throw 'Thumbnail dist must be absent before the ordinary build.'
          }
          pnpm tauri:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath native\shell-thumbnails\dist) {
            throw 'The ordinary Tauri build created thumbnail distribution output.'
          }

      - run: cargo fmt --manifest-path native/shell-thumbnails/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path native/shell-thumbnails/Cargo.toml --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --manifest-path native/shell-thumbnails/Cargo.toml --workspace --target x86_64-pc-windows-msvc
      - run: pnpm thumbnail:test:windows-installer

      - name: Build final Windows provider
        run: pnpm bundle:windows:thumbnail

      - name: Inspect COM exports
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dumpbin)) { throw 'dumpbin.exe was not found.' }
          $exports = & $dumpbin /exports $env:WINDOWS_PROVIDER_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exports
          foreach ($name in @('DllGetClassObject', 'DllCanUnloadNow')) {
            if (-not ($exports -match $name)) { throw "Missing COM export: $name" }
          }
          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -Path $windowsKitsBin -Filter signtool.exe -File -Recurse |
            Where-Object { $_.DirectoryName -like '*\x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Decode Windows release certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 is required for release tags.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'flow-reader-windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows provider
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required for release tags.'
          }
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $env:WINDOWS_PROVIDER_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build final NSIS setup
        shell: pwsh
        env:
          BUNDLE_TAURI_COMMAND: ${{ startsWith(github.ref, 'refs/tags/') && 'bundle:windows:release:tauri' || 'bundle:windows:installed:tauri' }}
        run: |
          & native\shell-thumbnails\packaging\windows\prepare-nsis.ps1
          pnpm $env:BUNDLE_TAURI_COMMAND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setups = @(Get-ChildItem -LiteralPath src-tauri\target\release\bundle\nsis -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one NSIS setup, found $($setups.Count)." }
          "WINDOWS_SETUP_PATH=$($setups[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $env:WINDOWS_SETUP_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @($env:WINDOWS_PROVIDER_PATH, $env:WINDOWS_SETUP_PATH)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
            }
          }

      - name: Collect Windows installer
        shell: pwsh
        run: |
          pnpm bundle:windows:collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setups = @(Get-ChildItem -LiteralPath release -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one collected NSIS setup, found $($setups.Count)." }
          "WINDOWS_SETUP_PATH=$($setups[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v7
        with:
          name: flow-reader-thumbnail-windows-x86_64-${{ github.sha }}
          path: ${{ env.WINDOWS_PROVIDER_PATH }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: flow-reader-installed-windows-x86_64-${{ github.sha }}
          path: ${{ env.WINDOWS_SETUP_PATH }}
          if-no-files-found: error

  macos:
    name: macOS Quick Look and installed app
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/target
            native/shell-thumbnails/target
            src-tauri/target
          key: shell-thumbnails-macos-intel-${{ hashFiles('crates/Cargo.lock', 'native/shell-thumbnails/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: shell-thumbnails-macos-intel-
      - run: pnpm install --frozen-lockfile
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo fmt --manifest-path native/shell-thumbnails/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path native/shell-thumbnails/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: pnpm bundle:macos:thumbnail

      - name: Import Apple release certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" ]]; then
            echo 'Apple certificate secrets are required for release tags.' >&2
            exit 1
          fi
          certificate_path="${RUNNER_TEMP}/flow-reader-apple-signing.p12"
          keychain_path="${RUNNER_TEMP}/flow-reader-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

      - name: Ad-hoc sign Quick Look extension
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: codesign --force --sign - --timestamp=none native/shell-thumbnails/dist/macos/DerivedData/Build/Products/Release/FlowReaderThumbnail.appex

      - name: Sign Quick Look extension for release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo 'APPLE_SIGNING_IDENTITY is required for release tags.' >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" --entitlements native/shell-thumbnails/macos-extension/FlowReaderThumbnail/FlowReaderThumbnail.entitlements native/shell-thumbnails/dist/macos/DerivedData/Build/Products/Release/FlowReaderThumbnail.appex

      - name: Build ad-hoc installed app
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm bundle:macos:installed:tauri

      - name: Build, sign, notarize, and staple release app
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is required for release tags." >&2
              exit 1
            fi
          done
          pnpm bundle:macos:release:tauri

      - name: Verify EPUB opening and Quick Look lifecycle
        run: pnpm thumbnail:test:macos-installer

      - name: Verify notarized release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_path='src-tauri/target/universal-apple-darwin/release/bundle/macos/Flow Reader.app'
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"

      - name: Collect macOS application
        run: pnpm bundle:macos:collect

      - name: Prepare macOS artifacts
        run: |
          artifact_dir='native/shell-thumbnails/dist/artifacts/macos'
          appex_path='native/shell-thumbnails/dist/macos/DerivedData/Build/Products/Release/FlowReaderThumbnail.appex'
          app_path='release/Flow Reader.app'
          mkdir -p "${artifact_dir}"
          ditto -c -k --sequesterRsrc --keepParent "${appex_path}" "${artifact_dir}/FlowReaderThumbnail.appex.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" "${artifact_dir}/FlowReader.app.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: flow-reader-thumbnail-macos-universal-${{ github.sha }}
          path: native/shell-thumbnails/dist/artifacts/macos/FlowReaderThumbnail.appex.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: flow-reader-installed-macos-universal-${{ github.sha }}
          path: native/shell-thumbnails/dist/artifacts/macos/FlowReader.app.zip
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: shell-integrations-linux-${{ hashFiles('crates/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: shell-integrations-linux-

      - name: Install Tauri and lifecycle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            desktop-file-utils \
            libfuse2 \
            xvfb \
            dbus-x11 \
            zip

      - run: pnpm install --frozen-lockfile
      - name: Build local AppImage
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: pnpm bundle:linux:installed:tauri
      - name: Build release AppImage
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm bundle:linux:release:tauri
      - run: pnpm bundle:linux:collect

      - name: Locate Linux AppImage
        run: |
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print)
          [[ "${#appimages[@]}" == "1" ]] || { echo "Expected one AppImage, found ${#appimages[@]}." >&2; exit 1; }
          echo "LINUX_APPIMAGE_PATH=$(realpath "${appimages[0]}")" >> "${GITHUB_ENV}"

      - name: Verify AppImage and direct EPUB opening
        run: xvfb-run -a dbus-run-session -- pnpm test:bundle:linux-appimage "${LINUX_APPIMAGE_PATH}"

      - uses: actions/upload-artifact@v7
        with:
          name: flow-reader-appimage-linux-x86_64-${{ github.sha }}
          path: ${{ env.LINUX_APPIMAGE_PATH }}
          if-no-files-found: error

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [core-check, windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flow-reader-thumbnail-windows-x86_64-${{ github.sha }}
          path: release-artifacts/flow-reader-thumbnail-windows-x86_64-${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: flow-reader-thumbnail-macos-universal-${{ github.sha }}
          path: release-artifacts/flow-reader-thumbnail-macos-universal-${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: flow-reader-installed-windows-x86_64-${{ github.sha }}
          path: release-artifacts/flow-reader-installed-windows-x86_64-${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: flow-reader-installed-macos-universal-${{ github.sha }}
          path: release-artifacts/flow-reader-installed-macos-universal-${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: flow-reader-appimage-linux-x86_64-${{ github.sha }}
          path: release-artifacts/flow-reader-appimage-linux-x86_64-${{ github.sha }}

      - name: Validate artifact commit identity
        run: |
          expected=(
            flow-reader-thumbnail-windows-x86_64
            flow-reader-thumbnail-macos-universal
            flow-reader-installed-windows-x86_64
            flow-reader-installed-macos-universal
            flow-reader-appimage-linux-x86_64
          )
          for prefix in "${expected[@]}"; do
            directory="release-artifacts/${prefix}-${GITHUB_SHA}"
            [[ -d "${directory}" ]] || { echo "Missing artifact directory: ${directory}" >&2; exit 1; }
            [[ -n "$(find "${directory}" -type f -print -quit)" ]] || { echo "Empty artifact: ${directory}" >&2; exit 1; }
          done
          directory_count="$(find release-artifacts -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          [[ "${directory_count}" == "5" ]]
          while IFS= read -r directory; do
            [[ "$(basename "${directory}")" == *-"${GITHUB_SHA}" ]]
          done < <(find release-artifacts -mindepth 1 -maxdepth 1 -type d -print)

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          mapfile -t files < <(find release-artifacts -type f -print)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
