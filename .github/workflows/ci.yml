name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.25.0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_checks: ${{ steps.filter.outputs.has_checks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${BEFORE_SHA}"
          fi

          zero_sha="0000000000000000000000000000000000000000"
          if [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
            if git show-ref --verify --quiet "${default_ref}" && merge_base="$(git merge-base "${default_ref}" "${GITHUB_SHA}")"; then
              base_sha="${merge_base}"
            elif parent_sha="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null)"; then
              base_sha="${parent_sha}"
            else
              base_sha=''
            fi
          fi

          if [[ -z "${base_sha}" ]]; then
            git ls-files > changed-files.txt
          else
            git diff --no-renames --name-only "${base_sha}" "${GITHUB_SHA}" > changed-files.txt
          fi

          app=false
          unit=false
          test_static=false
          integration=false
          scripts=false
          skills=false
          epubjs=false
          rust=false
          crates=false
          native_rust=false
          shell_scripts=false
          powershell_scripts=false
          native_macos=false
          tauri_config=false
          workflow_config=false
          package_manifest=false

          require_node_suite() {
            app=true
            unit=true
            test_static=true
            integration=true
            scripts=true
            skills=true
            epubjs=true
          }

          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                workflow_config=true
                ;;
              package.json)
                package_manifest=true
                package_runtime_filter='{name, type, packageManager, engines, dependencies, devDependencies, peerDependencies, optionalDependencies, pnpm}'
                if [[ -z "${base_sha}" ]] || ! git cat-file -e "${base_sha}:package.json" 2>/dev/null; then
                  require_node_suite
                elif [[ "$(git show "${base_sha}:package.json" | jq -cS "${package_runtime_filter}")" != "$(jq -cS "${package_runtime_filter}" package.json)" ]]; then
                  require_node_suite
                fi
                ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc)
                require_node_suite
                ;;
              biome.json)
                app=true
                test_static=true
                scripts=true
                skills=true
                ;;
              components.json|index.html|tsconfig.json|vite.config.ts)
                app=true
                unit=true
                ;;
              vitest.config.ts)
                test_static=true
                unit=true
                ;;
              playwright.config.ts)
                test_static=true
                integration=true
                ;;
              src/updateChangelog.ts)
                app=true
                unit=true
                scripts=true
                ;;
              src/*)
                app=true
                unit=true
                ;;
              scripts/validate-bundles/*.sh)
                shell_scripts=true
                ;;
              scripts/validate-bundles/*.ps1)
                powershell_scripts=true
                ;;
              scripts/*)
                scripts=true
                ;;
              tests/unit/*)
                test_static=true
                unit=true
                ;;
              tests/integration/*)
                test_static=true
                integration=true
                ;;
              tests/support/*)
                test_static=true
                unit=true
                integration=true
                ;;
              tests/*)
                test_static=true
                ;;
              .agents/skills/*/scripts/*.mjs)
                skills=true
                ;;
              packages/epubjs/*)
                app=true
                epubjs=true
                ;;
              src-tauri/Cargo.toml|src-tauri/Cargo.lock|src-tauri/build.rs|src-tauri/rustfmt.toml|src-tauri/src/*)
                rust=true
                ;;
              src-tauri/*.json)
                tauri_config=true
                ;;
              crates/Cargo.lock)
                crates=true
                ;;
              crates/Cargo.toml|crates/epub-cover/*)
                crates=true
                rust=true
                native_rust=true
                ;;
              crates/epub-thumbnail/*)
                crates=true
                native_rust=true
                ;;
              crates/*)
                crates=true
                ;;
              native/shell-thumbnails/Cargo.toml|native/shell-thumbnails/Cargo.lock|native/shell-thumbnails/*/Cargo.toml|native/shell-thumbnails/*/build.rs|native/shell-thumbnails/*/src/*|native/shell-thumbnails/*/tests/*|native/shell-thumbnails/windows-identifiers.json)
                native_rust=true
                ;;
              .husky/*|native/shell-thumbnails/macos-extension/*.sh)
                shell_scripts=true
                ;;
              native/shell-thumbnails/packaging/windows/*.ps1)
                powershell_scripts=true
                ;;
              native/shell-thumbnails/macos-extension/*)
                native_macos=true
                ;;
            esac
          done < changed-files.txt

          matrix='{"include":['
          separator=''
          add_check() {
            matrix+="${separator}$1"
            separator=','
          }

          node_checks=false
          for required in "${app}" "${unit}" "${test_static}" "${scripts}" "${skills}"; do
            if [[ "${required}" == "true" ]]; then
              node_checks=true
            fi
          done
          if [[ "${node_checks}" == "true" ]]; then
            add_check "{\"area\":\"node\",\"runner\":\"ubuntu-24.04\",\"kind\":\"node\",\"script\":\"\",\"node\":true,\"browser\":false,\"app\":${app},\"unit\":${unit},\"test_static\":${test_static},\"integration\":false,\"scripts\":${scripts},\"skills\":${skills},\"epubjs\":false}"
          fi
          if [[ "${integration}" == "true" || "${epubjs}" == "true" ]]; then
            add_check "{\"area\":\"browser-chromium\",\"runner\":\"ubuntu-24.04\",\"kind\":\"node\",\"script\":\"\",\"node\":true,\"browser\":true,\"playwright_browser\":\"chromium\",\"playwright_project\":\"chromium\",\"app\":false,\"unit\":false,\"test_static\":false,\"integration\":${integration},\"scripts\":false,\"skills\":false,\"epubjs\":${epubjs}}"
          fi
          if [[ "${integration}" == "true" ]]; then
            add_check '{"area":"browser-webkit","runner":"ubuntu-24.04","kind":"node","script":"","node":true,"browser":true,"playwright_browser":"webkit","playwright_project":"webkit","app":false,"unit":false,"test_static":false,"integration":true,"scripts":false,"skills":false,"epubjs":false}'
          fi
          [[ "${rust}" == "false" ]] || add_check '{"area":"rust","runner":"windows-2025","kind":"rust","script":"check:rust","node":false,"browser":false,"lock":"src-tauri/Cargo.lock","target":"src-tauri/target"}'
          [[ "${crates}" == "false" ]] || add_check '{"area":"crates","runner":"ubuntu-24.04","kind":"rust","script":"check:crates","node":false,"browser":false,"lock":"crates/Cargo.lock","target":"crates/target"}'
          [[ "${native_rust}" == "false" ]] || add_check '{"area":"native-rust","runner":"windows-2025","kind":"rust","script":"check:native-rust","node":false,"browser":false,"lock":"native/shell-thumbnails/Cargo.lock","target":"native/shell-thumbnails/target"}'
          if [[ "${shell_scripts}" == "true" || "${tauri_config}" == "true" || "${workflow_config}" == "true" || "${package_manifest}" == "true" ]]; then
            add_check "{\"area\":\"portable-static\",\"runner\":\"ubuntu-24.04\",\"kind\":\"portable-static\",\"script\":\"\",\"node\":false,\"browser\":false,\"shell_scripts\":${shell_scripts},\"tauri_config\":${tauri_config},\"workflow_config\":${workflow_config},\"package_manifest\":${package_manifest}}"
          fi
          [[ "${powershell_scripts}" == "false" ]] || add_check '{"area":"powershell-scripts","runner":"windows-2025","kind":"powershell","script":"","node":false,"browser":false}'
          [[ "${native_macos}" == "false" ]] || add_check '{"area":"native-macos","runner":"macos-15-intel","kind":"native-macos","script":"","node":false,"browser":false}'

          matrix+=']}'
          if [[ -n "${separator}" ]]; then
            has_checks=true
          else
            has_checks=false
          fi

          {
            echo "matrix=${matrix}"
            echo "has_checks=${has_checks}"
          } >> "${GITHUB_OUTPUT}"

          echo "Changed files:"
          cat changed-files.txt
          echo "Check matrix: ${matrix}"

  checks:
    name: Check ${{ matrix.area }}
    needs: changes
    if: needs.changes.outputs.has_checks == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        if: matrix.kind == 'node' || matrix.kind == 'rust'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        if: matrix.node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Node.js dependencies
        if: matrix.node
        run: pnpm install --frozen-lockfile

      - name: Install browser
        if: matrix.browser
        run: pnpm exec playwright install --with-deps ${{ matrix.playwright_browser }}

      - name: Cache Cargo dependencies
        if: matrix.kind == 'rust'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.target }}
          key: ci-${{ matrix.area }}-${{ runner.os }}-${{ hashFiles(matrix.lock) }}
          restore-keys: ci-${{ matrix.area }}-${{ runner.os }}-

      - name: Run package check
        if: matrix.kind == 'rust'
        run: pnpm ${{ matrix.script }}

      - name: Check application
        if: matrix.kind == 'node' && matrix.app
        run: pnpm check:app
      - name: Run unit tests
        if: matrix.kind == 'node' && matrix.unit
        run: pnpm test:unit:ci
      - name: Check test sources
        if: matrix.kind == 'node' && matrix.test_static
        run: pnpm check:test-static
      - name: Run browser integration tests
        if: matrix.kind == 'node' && matrix.integration
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: pnpm test:integration:ci --project=${{ matrix.playwright_project }}
      - name: Check repository scripts
        if: matrix.kind == 'node' && matrix.scripts
        run: pnpm check:scripts
      - name: Check skill sources
        if: matrix.kind == 'node' && matrix.skills
        run: pnpm check:skills
      - name: Run EPUB engine tests
        if: matrix.kind == 'node' && matrix.epubjs
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: pnpm check:epubjs:ci

      - name: Check skill script syntax
        if: matrix.kind == 'node' && matrix.skills
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            node --check "${script}"
          done < <(find .agents/skills -type f -name '*.mjs' -print)

      - name: Check shell syntax
        if: matrix.kind == 'portable-static' && matrix.shell_scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(
            find .husky -maxdepth 1 -type f -print
            find native/shell-thumbnails -type f -name '*.sh' -print
            find scripts/validate-bundles -type f -name '*.sh' -print
          )
      - name: Check PowerShell syntax
        if: matrix.kind == 'powershell'
        shell: pwsh
        run: |
          Get-ChildItem native/shell-thumbnails,scripts/validate-bundles -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Check macOS native sources
        if: matrix.kind == 'native-macos'
        shell: bash
        run: |
          set -euo pipefail
          find native/shell-thumbnails/macos-extension -type f -name '*.swift' -print0 | xargs -0 swiftc -parse
          find native/shell-thumbnails/macos-extension -type f \( -name '*.plist' -o -name '*.entitlements' \) -print0 | xargs -0 -n 1 plutil -lint
          xcodebuild -list -project native/shell-thumbnails/macos-extension/FlowReaderThumbnail.xcodeproj
      - name: Check Tauri JSON configuration
        if: matrix.kind == 'portable-static' && matrix.tauri_config
        shell: bash
        run: |
          set -euo pipefail
          for config in src-tauri/*.json; do
            jq empty "${config}"
          done
      - name: Check package manifest
        if: matrix.kind == 'portable-static' && matrix.package_manifest
        shell: bash
        run: jq empty package.json
      - name: Check workflow definitions
        if: matrix.kind == 'portable-static' && matrix.workflow_config
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  result:
    name: CI result
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHECKS_RESULT: ${{ needs.checks.result }}
    steps:
      - name: Require every applicable check to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHANGES_RESULT}" == "success" ]]
          [[ "${CHECKS_RESULT}" == "success" || "${CHECKS_RESULT}" == "skipped" ]]
