name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.25.0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_checks: ${{ steps.filter.outputs.has_checks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Classify changed files
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify.ts --ci-plan

  checks:
    name: Check ${{ matrix.area }}
    needs: changes
    if: needs.changes.outputs.has_checks == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ matrix.dependencies && 'pnpm' || '' }}
      - name: Install Node.js dependencies
        if: matrix.dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        if: matrix.browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Cache Cargo dependencies
        if: matrix.lock
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.target }}
          key: ci-${{ matrix.area }}-${{ runner.os }}-${{ hashFiles(matrix.lock) }}
          restore-keys: ci-${{ matrix.area }}-${{ runner.os }}-

      - name: Install workflow validator
        if: matrix.workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run selected checks
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
          pnpm_config_verify_deps_before_run: 'false'
        run: pnpm verify --checks '${{ matrix.checks }}'

  result:
    name: CI result
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHECKS_RESULT: ${{ needs.checks.result }}
    steps:
      - name: Require every applicable check to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHANGES_RESULT}" == "success" ]]
          [[ "${CHECKS_RESULT}" == "success" || "${CHECKS_RESULT}" == "skipped" ]]
